name: 每日更新 · 长白山天池逐日台账

on:
  push:
    branches: [main]
  schedule:
    # 北京时间 18:00 = UTC 10:00
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "忽略缓存全量重抓（用于规则变更后重建）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并生成日历
        env:
          FULL_REFRESH: ${{ github.event.inputs.full_refresh }}
        run: |
          if [ "$FULL_REFRESH" = "true" ]; then
            echo "全量重抓：清空缓存"
            rm -f data/dailies.json data/anchors.json
          fi
          python scripts/build.py

      - name: 提交数据与页面
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          git commit -m "chore(auto): 更新台账 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') [skip ci]"
          git push

      - name: 摘要
        if: always()
        run: |
          {
            echo "### 长白山天池台账 · 构建结果"
            echo ""
            cat data/last-run.json 2>/dev/null || echo "无 last-run.json"
          } >> $GITHUB_STEP_SUMMARY
