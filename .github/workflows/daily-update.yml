name: 每日更新 · 长白山天池逐日台账

# 2026-11-28 起停用所有自动触发：GitHub schedule 实测会提前 30-70 分钟跑，
# 且与云主机上的豆包定时任务重复。现在唯一的生产构建入口是云主机的豆包定时任务
# （每天 18:20 跑 scripts/build.py 并 push），Pages 走 Deploy from a branch，push 即部署。
# 本文件保留为手动兜底：需要时在 Actions 页面点 Run workflow。
on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "全量回扫。默认不勾＝仅增量（只看最近 14 天），规则变更或缓存损坏时才需要"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并生成日历
        env:
          FULL_REFRESH: ${{ github.event.inputs.full_refresh }}
        run: |
          if [ "$FULL_REFRESH" = "true" ]; then
            echo "全量重抓：清空缓存"
            rm -f data/dailies.json data/anchors.json
          fi
          python scripts/build.py

      - name: 提交数据与页面
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          git commit -m "chore(auto): 更新台账 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') [skip ci]"
          git push

      - name: 摘要
        if: always()
        run: |
          {
            echo "### 长白山天池台账 · 构建结果"
            echo ""
            cat data/last-run.json 2>/dev/null || echo "无 last-run.json"
          } >> $GITHUB_STEP_SUMMARY
