name: 每日更新 · 长白山天池逐日台账

on:
  push:
    branches: [main]
  schedule:
    # 北京时间 18:30 = UTC 10:30（主更新）
    # 设 18:30 而非 19:00：GitHub schedule 实测会提前 30-70 分钟触发，也会偶发延迟；
    # 落在 18:30 可保证 19:00 打开页面时，本次构建一定已完成（实测提前时约 17:20 跑完，
    # 延迟 15 分钟时约 18:45 跑完，两种情况都在 19:00 之前）
    - cron: "30 10 * * *"
    # 北京时间 08:30 = UTC 00:30（晨间补充：此时才能抓到“当天主峰车票是否在售”，
    # 这是判断当天是否开放的独立信号；到晚间主轮时当日票已停售，抓不到）
    - cron: "30 0 * * *"
    # 北京时间 24:00 = UTC 16:00（晚轮补漏：澎湃列表接口对刚发布的公报存在约 1 天
    # 索引延迟，早间设点加之 GitHub 跑批延迟，实际常落在索引可见之前，导致前一天的
    # 公报漏抓。这一轮落点更晚，用来把已索引未入库的公报补进台账）
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "全量回扫。默认不勾＝仅增量（只看最近 14 天），规则变更或缓存损坏时才需要"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并生成日历
        env:
          FULL_REFRESH: ${{ github.event.inputs.full_refresh }}
        run: |
          if [ "$FULL_REFRESH" = "true" ]; then
            echo "全量重抓：清空缓存"
            rm -f data/dailies.json data/anchors.json
          fi
          python scripts/build.py

      - name: 提交数据与页面
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          git commit -m "chore(auto): 更新台账 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') [skip ci]"
          git push

      - name: 摘要
        if: always()
        run: |
          {
            echo "### 长白山天池台账 · 构建结果"
            echo ""
            cat data/last-run.json 2>/dev/null || echo "无 last-run.json"
          } >> $GITHUB_STEP_SUMMARY
